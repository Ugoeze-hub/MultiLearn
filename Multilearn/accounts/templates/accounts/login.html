<!-- {% extends "base.html" %} -->
<!-- {% block content %} -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: url("{% static 'img/2.webp' %}") no-repeat center center/cover;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Full Page Background */
    .bubble-background {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 5rem;
      height: 100vh;
      overflow: hidden;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 1rem 0;
    }

    .container.nav__container {
      max-width: 1200px;
      margin: auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav__menu {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    .nav__menu a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .nav__menu a:hover {
      text-decoration: underline;
    }

    nav h4 {
      color: #fff;
      font-size: 1.5rem;
    }

    nav button {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
    }

    /* Login Container */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* Glass Effect Box */
    .login-box {
      background: rgba(255, 255, 255, 0.15);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 1s ease-in;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .login-box h2 {
      margin-bottom: 1rem;
      color: #fff;
    }

    .login-box form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-box form input {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    .login-box button {
      padding: 0.75rem;
      border: none;
      background: #6c63ff;
      color: #fff;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background: #5a54d1;
    }

    .login-box p {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #fff;
    }

    .login-box a {
      color: #fff;
      text-decoration: underline;
    }

    /* Fade In */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .nav__menu {
        display: none;
      }

      nav button {
        display: inline;
      }

      .login-box {
        padding: 2rem 1rem;
      }
    }
  </style>

  <body>
    <!-- Header/Nav -->
    <nav>
      <div class="container nav__container">
        <a href="/"><h4>Multilearn</h4></a>
        <button id="open-menu-btn" aria-label="Open navigation menu">
          <i class="uil uil-bars"></i>
        </button>
        <button
          id="close-menu-btn"
          aria-label="Close navigation menu"
          style="display: none"
        >
          <i class="uil uil-multiply"></i>
        </button>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="bubble-background">
      <main class="login-container">
        <section class="login-box">
          <h2>Log In</h2>
          <form method="post">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit">Log In</button>
          </form>
          <p>
            Don't have an account?
            <a href="{% url 'accounts:signup' %}">Sign up</a>
          </p>
          <p><a href="/">Back</a></p>
        </section>
      </main>
    </div>
  </body>
</html>
<!-- {% endblock %} -->
