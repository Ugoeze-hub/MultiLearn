{% extends "quizzes/dashboard.html" %}

{% block content %}
<div class="search-container">
    <h2>Create a Quiz</h2>
    <form method="post" action="{% url 'quizzes:create_quiz' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label for="topic" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">
                <i class="fas fa-book mr-2"></i>Topic
            </label>
            <input type="text" name="topic" id="topic" class="search-bar input" placeholder="Enter quiz topic" required>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="difficulty" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">
                <i class="fas fa-level-up-alt mr-2"></i>Difficulty
            </label>
            <select name="difficulty" id="difficulty" class="search-bar input">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <button type="submit" class="search-bar button">Create Quiz</button>
    </form>
</div>
{% endblock %}
