{% extends "quizzes/dashboard.html" %}
{% block content %}
<style>
  .btn-bounce:hover {
    animation: bounce 0.5s;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .error-illustration {
    background: radial-gradient(circle at 30% 50%, rgba(199, 210, 254, 0.2), rgba(255, 255, 255, 0));
  }
</style>

<div class="flex items-center justify-center min-h-[80vh] px-4">
  <div class="error-illustration max-w-md w-full p-8 bg-white rounded-xl shadow-lg text-center relative overflow-hidden dark:bg-[#111827]">
    <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-indigo-100 opacity-20"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full bg-purple-100 opacity-20"></div>

    <div class="relative z-10">
      <div class="w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-indigo-100 text-indigo-600 dark:bg-indigo-500 dark:text-white">
        <i class="fas fa-exclamation-triangle text-3xl"></i>
      </div>

      <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-3">
        Something went wrong <span class="text-indigo-500">😓</span>
      </h2>

      <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 mb-6 text-left dark:bg-indigo-950 dark:border-indigo-400">
        <div class="flex">
          <div class="flex-shrink-0">
            <i class="fas fa-info-circle text-indigo-500"></i>
          </div>
          <div class="ml-3">
            <p class="text-sm text-indigo-700 dark:text-indigo-300">{{ error }}</p>
          </div>
        </div>
      </div>

      <p class="text-gray-600 dark:text-gray-300 mb-6 text-sm">
        We couldn't process your request. Please try again or contact support if the issue persists.
      </p>

      <a href="{% url 'quizzes:create_quiz' %}" class="btn-bounce inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow transition-all">
        <i class="fas fa-redo-alt mr-2"></i> Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
