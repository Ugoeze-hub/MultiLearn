{% extends "quizzes/dashboard.html" %}

{% block content %}
<div class="search-container">
    <h2>{{ quiz.topic|title }} Quiz ({{ quiz.difficulty|title }})</h2>
    <form method="post" action="{% url 'quizzes:take_quiz' quiz.id %}">
        {% csrf_token %}
        <div class="course-card">
            <div class="course-img">
                <i class="fas fa-question-circle fa-3x"></i>
            </div>
            <div class="course-info">
                {{ form.as_p }}
                <div style="margin-top: 1rem;">
                    <button type="submit" class="search-bar button">
                        <i class="fas fa-check mr-2"></i>Submit Quiz
                    </button>
                    <a href="{% url 'quizzes:dashboard' %}" class="search-bar button" style="margin-left: 1rem;">
                        <i class="fas fa-home mr-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
